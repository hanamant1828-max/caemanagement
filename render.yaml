services:
  - type: web
    name: automarket
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: automarket-db
          property: connectionString

databases:
  - name: automarket-db
    databaseName: automarket
    user: automarket
